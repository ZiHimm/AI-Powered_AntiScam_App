# Runs the unit tests, then builds the Android APK on every push that touches android/, and publishes it as a
# public download: Releases → "Android app (latest build)" → AntiScamGuard.apk
name: Android APK

on:
  push:
    branches: [main, jason/step2]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload test report (if tests failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: android/app/build/reports/tests/testDebugUnitTest/

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AntiScamGuard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AntiScamGuard-apk
          path: android/AntiScamGuard.apk

      - name: Pick the download (main = demo APK, jason/step2 = preview)
        id: rel
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "tag=android-latest" >> "$GITHUB_OUTPUT"
            echo "name=Android app (latest build)" >> "$GITHUB_OUTPUT"
          else
            echo "tag=android-step2-preview" >> "$GITHUB_OUTPUT"
            echo "name=Android app (Step 2 preview: everyone protected, branch jason/step2)" >> "$GITHUB_OUTPUT"
          fi

      - name: Move the release tag to this commit
        run: |
          git tag -f ${{ steps.rel.outputs.tag }}
          git push -f origin ${{ steps.rel.outputs.tag }}

      - name: Publish as a release download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.name }}
          prerelease: true
          make_latest: false
          files: android/AntiScamGuard.apk
          body: |
            Build of the AntiScam Guard Android app from `${{ github.ref_name }}`, commit ${{ github.sha }}.

            **Install:** download `AntiScamGuard.apk` on the phone, open it, allow "Install unknown apps".
            Then follow the setup steps in [android/README.md](https://github.com/${{ github.repository }}/blob/main/android/README.md).
