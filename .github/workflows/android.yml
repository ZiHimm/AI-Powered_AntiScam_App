# Builds the Android APK on every push that touches android/ and publishes it as a
# public download: Releases → "Android app (latest build)" → AntiScamGuard.apk
name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AntiScamGuard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AntiScamGuard-apk
          path: android/AntiScamGuard.apk

      - name: Move the android-latest tag to this commit
        run: |
          git tag -f android-latest
          git push -f origin android-latest

      - name: Publish as a release download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android app (latest build)
          prerelease: true
          make_latest: false
          files: android/AntiScamGuard.apk
          body: |
            Latest build of the AntiScam Guard Android app, from commit ${{ github.sha }}.

            **Install:** download `AntiScamGuard.apk` on the phone, open it, allow "Install unknown apps".
            Then follow the setup steps in [android/README.md](https://github.com/${{ github.repository }}/blob/main/android/README.md).
